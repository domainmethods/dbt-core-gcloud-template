# Pre-commit hooks for dbt project linting
#
# sqlfluff hooks run on pre-push to catch lint issues before they reach the remote
# without slowing down individual commits. They can also be invoked locally via:
#   pre-commit run --hook-stage pre-push --all-files    # lint all SQL
#   pre-commit run --hook-stage manual sqlfluff-fix     # auto-fix all SQL
#   make lint                                           # shortcut via Makefile
#
# yamllint runs on every commit (stages: [pre-commit, manual]).
default_language_version:
  python: python3

repos:
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.4.2
    hooks:
      - id: sqlfluff-lint
        additional_dependencies: [
          "sqlfluff-templater-dbt",
          "dbt-core==1.10.8",
          "dbt-bigquery==1.10.1"
        ]
        args: ["--dialect", "bigquery", "--templater", "dbt"]
        stages: [pre-push, manual]
        files: ^models/.*\.sql$
      - id: sqlfluff-fix
        additional_dependencies: [
          "sqlfluff-templater-dbt",
          "dbt-core==1.10.8",
          "dbt-bigquery==1.10.1"
        ]
        args: ["--dialect", "bigquery", "--templater", "dbt"]
        stages: [pre-push, manual]
        files: ^models/.*\.sql$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: ["-d", "{extends: default, rules: {line-length: {max: 140}, document-start: disable, truthy: disable, comments-indentation: disable, indentation: disable, empty-lines: disable}}"]
        stages: [pre-commit, manual]
        files: ^models/.*\.(yml|yaml)$
