name: ci-pr

on:
  pull_request:
    branches: [main]
    paths-ignore: ["README.md"]

# One run per PR at a time, so two close pushes can't both create a diff comment (#41).
# Queue rather than cancel: cancelling mid-run could orphan the ephemeral BigQuery dataset.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  DBT_BQ_LOCATION: US
  DBT_TARGET: ci
  DBT_PROFILES_DIR: ./profiles

jobs:
  # Seconds, not minutes: no dbt install, so a YAML typo fails before the BigQuery build (#33).
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: yamllint (every YAML file; config in .yamllint)
        run: |
          python -m pip install yamllint==1.37.1
          yamllint .
      # PyYAML comes with yamllint, which these checks need.
      - name: Check ci.yml gates
        run: bash scripts/tests/test_ci_workflow.sh
      - name: Test release workflow with CLI stubs
        run: python3 scripts/tests/test_release_workflow.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test shell scripts
        run: |
          bash scripts/tests/test_pr_schema_diff.sh
          bash scripts/tests/test_artifacts_lifecycle.sh
          bash scripts/tests/test_pr_data_diff.sh
          bash scripts/tests/test_get_changed_models.sh
          bash scripts/tests/test_ci_build.sh
          bash scripts/tests/test_ci_datasets.sh
          bash scripts/tests/test_bootstrap_project_grants.sh
          bash scripts/tests/test_upsert_pr_comment.sh
          bash scripts/tests/test_lookup_prod_manifest.sh
          bash scripts/tests/test_docs_website.sh
          bash scripts/tests/test_entrypoint.sh
          bash scripts/tests/test_verify_timezone_conventions.sh
          bash scripts/tests/test_deploy_and_schedule.sh
          bash scripts/tests/test_set_github_secrets.sh
          bash scripts/tests/test_policy_updates.sh
          bash scripts/tests/test_wif_github.sh
          bash scripts/tests/test_monitoring.sh
      # Timezone conventions (#68): no zone conversion before marts, no DATETIME(TIMESTAMP(x))
      # double shift without a `-- tz-ok: <reason>`. Reads models/ only; no dbt, no credentials.
      - name: Check timezone conventions
        run: python3 scripts/verify_timezone_conventions.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install offline SQL lint dependencies
        run: |
          python -m pip install -r requirements.txt sqlfluff==3.4.2
          dbt deps
      - name: Lint enabled model SQL without BigQuery credentials
        run: bash scripts/lint_ci_sql.sh
        env:
          # dbt ls parses the profile and project locally.
          DBT_GCP_PROJECT_CI: lint-ci
          DBT_BQ_DATASET: lint_ci
          DBT_BQ_LOCATION: US
          DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      - name: Test offline SQL lint with enabled models
        run: bash scripts/tests/test_sqlfluff_ci.sh

  bigquery-ci:
    needs: [lint, yamllint]
    runs-on: ubuntu-latest
    env:
      DBT_BQ_LOCATION: ${{ secrets.BQ_LOCATION || 'US' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed dbt files
        id: changes
        run: bash scripts/get_changed_models.sh

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SA_EMAIL }}
          # Create the ADC credentials file that the oauth `ci` profile reads via GOOGLE_APPLICATION_CREDENTIALS
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v3

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Python & dbt install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set CI env
        run: |
          echo "DBT_GCP_PROJECT_CI=${{ secrets.GCP_PROJECT_CI }}" >> $GITHUB_ENV
          echo "DBT_ARTIFACTS_BUCKET=${{ secrets.DBT_ARTIFACTS_BUCKET }}" >> $GITHUB_ENV
          echo "DBT_USER=ci_${{ github.actor }}" >> $GITHUB_ENV
          echo "DBT_BQ_DATASET=ci_pr_${{ github.event.number }}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" >> $GITHUB_ENV
          echo "DBT_GCP_PROJECT_PROD=${{ secrets.GCP_PROJECT_PROD }}" >> $GITHUB_ENV
          echo "DBT_BQ_DATASET_PROD=${{ secrets.PROD_DATASET }}" >> $GITHUB_ENV
          echo "DIFF_LIMIT=200" >> $GITHUB_ENV
          echo "CI_SA_EMAIL=${{ secrets.GCP_CI_SA_EMAIL }}" >> $GITHUB_ENV
          echo "MAKE_DATASET_READONLY=true" >> $GITHUB_ENV
          echo "RUN_FRESHNESS=false" >> $GITHUB_ENV
          echo "FRESHNESS_SELECT=" >> $GITHUB_ENV
          echo "DBT_BQ_PRIORITY=interactive" >> $GITHUB_ENV
          echo "DBT_MAX_BYTES_BILLED=" >> $GITHUB_ENV
          echo "DBT_JOB_EXECUTION_TIMEOUT_SEC=" >> $GITHUB_ENV
          # Ensure dbt-bigquery (profiles.ci) finds the credentials file minted by auth step
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ steps.auth.outputs.credentials_file_path }}" >> $GITHUB_ENV

      - name: Install dbt packages
        run: dbt deps

      # Docs/config-only PRs (HAS_MODEL_CHANGES=false) only run `dbt parse`, so they
      # skip every step that touches BigQuery (#29).
      - name: Create ephemeral dataset
        if: ${{ env.HAS_MODEL_CHANGES != 'false' }}
        run: |
          dbt parse --target ci
          bash scripts/create_bq_dataset.sh

      - name: Slim CI build (with defer if prod manifest exists)
        id: dbt_build
        run: bash scripts/ci_build.sh

      - name: Run dbt tests (non-blocking; does not gate diffs)
        id: dbt_test
        if: ${{ steps.dbt_build.outcome == 'success' && env.HAS_MODEL_CHANGES != 'false' }}
        continue-on-error: true
        # --indirect-selection cautious: under --defer, a data test spanning a
        # freshly-built (selected) model and a deferred (stale-prod) model would
        # reconcile fresh-vs-stale and fail on non-code drift. cautious runs a
        # test only when every referenced model is selected, keeping those false
        # errors out of the report (they still run in the full nightly/prod build).
        run: |
          dbt test --target ci --indirect-selection cautious ${CI_SELECT:+--select "$CI_SELECT"} ${CI_DEFER}

      - name: Source freshness (optional)
        if: ${{ steps.dbt_build.outcome == 'success' && env.RUN_FRESHNESS == 'true' }}
        run: |
          if [[ -n "${FRESHNESS_SELECT}" ]]; then
            dbt source freshness --select "${FRESHNESS_SELECT}" || true
          else
            dbt source freshness || true
          fi

      - name: Generate docs (optional preview)
        if: ${{ steps.dbt_build.outcome == 'success' && env.HAS_MODEL_CHANGES != 'false' }}
        continue-on-error: true
        run: dbt docs generate --static

      - name: Generate data diffs for changed models
        if: ${{ steps.dbt_build.outcome == 'success' }}
        run: bash scripts/pr_data_diff.sh

      # continue-on-error keeps a schema-diff failure from failing the build, but
      # it does not bound runtime, and GitHub applies no per-step timeout (the
      # job-level 360-minute default would otherwise apply). The downstream
      # publish steps gate on this step's outcome so a partial report is never
      # posted as if it were complete.
      - name: Generate schema diffs for changed models
        id: schema_diff
        if: ${{ steps.dbt_build.outcome == 'success' && env.HAS_MODEL_CHANGES != 'false' }}
        continue-on-error: true
        timeout-minutes: 10
        run: bash scripts/pr_schema_diff.sh

      - name: Upload CI artifacts (docs + manifest + data diffs)
        if: ${{ steps.dbt_build.outcome == 'success' }}
        continue-on-error: true
        run: |
          echo "Using artifacts bucket: ${DBT_ARTIFACTS_BUCKET:-<unset>}"
          if [[ -z "${DBT_ARTIFACTS_BUCKET:-}" ]]; then
            echo "DBT_ARTIFACTS_BUCKET not set; skipping artifact upload"
          else
            # Verify the CI identity can list the bucket; if not, print guidance and skip.
            if ! gsutil ls "gs://${DBT_ARTIFACTS_BUCKET}/" >/dev/null 2>&1; then
              echo "[warn] CI could not list gs://${DBT_ARTIFACTS_BUCKET}/" >&2
              echo "       Run infra/10-bootstrap.sh to verify CI artifact access." >&2
              exit 0
            fi
            artifact_uri="gs://${DBT_ARTIFACTS_BUCKET}/ci/pr-${{ github.event.number }}-${{ github.run_id }}"
            # Composite uploads can create temporary objects outside ci/.
            if [[ -d ./target ]]; then
              gsutil -o GSUtil:parallel_composite_upload_threshold=0 -m rsync -r ./target "${artifact_uri}/"
            else
              echo "No ./target directory found; skipping docs rsync"
            fi
            if [[ -f target/manifest.json ]]; then
              gsutil -o GSUtil:parallel_composite_upload_threshold=0 cp target/manifest.json "${artifact_uri}/manifest.json"
            else
              echo "No target/manifest.json found; skipping manifest upload"
            fi
          fi
          echo "Diff reports generated under diff_reports/"
      - name: Attach data diffs to PR as artifact
        if: ${{ steps.dbt_build.outcome == 'success' && hashFiles('diff_reports/**') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: data-diff-pr-${{ github.event.number }}-${{ github.run_id }}
          path: diff_reports/

      - name: Attach schema diffs to PR as artifact
        if: ${{ steps.schema_diff.outcome == 'success' && hashFiles('schema_diff_reports/**') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: schema-diff-pr-${{ github.event.number }}-${{ github.run_id }}
          path: schema_diff_reports/

      - name: Post summary comment on PR
        if: ${{ steps.dbt_build.outcome == 'success' && hashFiles('diff_reports/summary.md') != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = 'diff_reports/summary.md';
            let body;
            try {
              body = fs.readFileSync(path, 'utf8');
            } catch (e) {
              body = '# dbt Data Diff Summary\n\n(No changes or no summary generated)';
            }
            // One comment per kind, updated in place; the previous run is kept collapsed (#41).
            const upsert = require(`${process.env.GITHUB_WORKSPACE}/scripts/lib/upsert_pr_comment.js`);
            await upsert({ github, context, kind: 'dbt-data-diff', body });

      - name: Post schema summary comment on PR
        if: ${{ steps.schema_diff.outcome == 'success' && hashFiles('schema_diff_reports/schema-summary.md') != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = 'schema_diff_reports/schema-summary.md';
            let body;
            try {
              body = fs.readFileSync(path, 'utf8');
            } catch (e) {
              body = '# dbt Schema Diff Summary\n\n(No changes or no summary generated)';
            }
            const upsert = require(`${process.env.GITHUB_WORKSPACE}/scripts/lib/upsert_pr_comment.js`);
            await upsert({ github, context, kind: 'dbt-schema-diff', body });

      - name: Cleanup dataset
        if: ${{ always() && env.HAS_MODEL_CHANGES != 'false' }}
        run: bash scripts/drop_bq_dataset.sh
