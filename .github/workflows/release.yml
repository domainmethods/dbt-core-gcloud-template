name: release

on:
  push:
    branches: [main]

# Keep the lock through the immediate Cloud Run execution.
concurrency:
  group: production-release
  queue: max
  cancel-in-progress: false

env:
  PROD_PROJECT_ID: ${{ secrets.GCP_PROJECT_PROD }}
  REGION: ${{ secrets.GCP_REGION }}
  SCHED_REGION: ${{ secrets.GCP_SCHED_REGION }}
  REPO: ${{ secrets.AR_REPO }}
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
  DBT_PROFILES_DIR: /app/profiles

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_PROD }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PROD_SA_EMAIL }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure docker auth to Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev"

      - name: Build container
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROD_PROJECT_ID:?Set GCP_PROJECT_PROD}/${REPO}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          docker build -t "$IMAGE_URI" .

      - name: Smoke test container
        run: |
          echo "Verifying container structure..."
          docker run --rm --entrypoint sh "$IMAGE_URI" -c "
            set -e
            echo 'Checking directory structure...'
            for d in hooks macros models profiles; do
              [ -d \"/app/\$d\" ] || { echo \"FAIL: /app/\$d missing\"; exit 1; }
            done
            echo 'Checking dbt is importable...'
            python -c 'import dbt.version; print(f\"dbt-core {dbt.version.installed}\")'
            echo 'Checking entrypoint exists...'
            [ -x /app/entrypoint.sh ] || { echo 'FAIL: entrypoint.sh not executable'; exit 1; }
            echo 'Smoke test passed.'
          "

      - name: Push container
        run: docker push "$IMAGE_URI"

      - name: Create/Update Cloud Run Job
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_SA_EMAIL: ${{ secrets.GCP_PROD_SA_EMAIL }}
          PROD_DATASET: ${{ secrets.PROD_DATASET }}
          BQ_LOCATION: ${{ secrets.BQ_LOCATION }}
          DBT_ARTIFACTS_BUCKET: ${{ secrets.DBT_ARTIFACTS_BUCKET }}
          DBT_DOCS_BUCKET: ${{ secrets.DBT_DOCS_BUCKET }}
          GENERATE_DOCS: ${{ secrets.GENERATE_DOCS }}
          RUN_FRESHNESS: ${{ secrets.RUN_FRESHNESS }}
          FRESHNESS_SELECT: ${{ secrets.FRESHNESS_SELECT }}
          DBT_MAX_BYTES_BILLED: ${{ secrets.DBT_MAX_BYTES_BILLED }}
          DBT_BQ_PRIORITY: ${{ secrets.DBT_BQ_PRIORITY }}
          DBT_JOB_EXECUTION_TIMEOUT_SEC: ${{ secrets.DBT_JOB_EXECUTION_TIMEOUT_SEC }}
        run: |
          JOB=dbt-prod-run
          set -e
          job_location=(--project "$PROD_PROJECT_ID" --region "$REGION")
          args=(--image "$IMAGE_URI" "${job_location[@]}")
          job_env=(
            DBT_TARGET=prod CI=true
            "DBT_GCP_PROJECT_PROD=$PROD_PROJECT_ID"
            "DBT_BQ_DATASET_PROD=$PROD_DATASET"
            "DBT_BQ_LOCATION=$BQ_LOCATION"
            "DBT_ARTIFACTS_BUCKET=$DBT_ARTIFACTS_BUCKET"
            "DBT_DOCS_BUCKET=$DBT_DOCS_BUCKET"
            "DBT_PROFILES_DIR=$DBT_PROFILES_DIR"
          )
          if gcloud run jobs describe "$JOB" "${job_location[@]}" >/dev/null 2>&1; then
            action=update
            args+=(--update-env-vars "$(IFS=,; printf '%s' "${job_env[*]}")")
          else
            action=create
            job_env+=(
              "GENERATE_DOCS=${GENERATE_DOCS:-true}"
              "RUN_FRESHNESS=${RUN_FRESHNESS:-true}"
              "FRESHNESS_SELECT=${FRESHNESS_SELECT:-}"
              "DBT_MAX_BYTES_BILLED=${DBT_MAX_BYTES_BILLED:-}"
              "DBT_BQ_PRIORITY=${DBT_BQ_PRIORITY:-interactive}"
              "DBT_JOB_EXECUTION_TIMEOUT_SEC=${DBT_JOB_EXECUTION_TIMEOUT_SEC:-}"
            )
            # A config file preserves commas and spaces in selectors.
            env_file=$(mktemp --suffix=.yaml)
            trap 'rm -f "$env_file"' EXIT
            jq -n --args '
              $ARGS.positional | map(index("=") as $i | {key: .[:$i], value: .[$i+1:]}) | from_entries
            ' "${job_env[@]}" > "$env_file"
            args+=(--env-vars-file "$env_file" --service-account "$PROD_SA_EMAIL"
              --task-timeout=3600s --memory=2Gi --cpu=1 --max-retries=0)
          fi

          # Read the live ref after selecting the action and before changing the job.
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq 'select(.protected == true) | .commit.sha')
          if [[ ! "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not verify the head of protected main."
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$current_sha" ]]; then
            echo "::notice::Skipping superseded release $GITHUB_SHA. Current main is $current_sha."
            exit 0
          fi
          gcloud run jobs "$action" "$JOB" "${args[@]}"
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Schedule the job (Cloud Scheduler)
        if: steps.apply.outputs.applied == 'true'
        env:
          # Via env, not inlined into the script, so the value is never parsed as shell.
          SCHED_CRON: ${{ secrets.SCHED_CRON }}
          SCHED_SA_EMAIL: ${{ secrets.GCP_SCHEDULER_INVOKER_SA }}
        run: |
          JOB=dbt-prod-run
          SCHED=dbt-prod-nightly
          # Same cron as infra/40-schedule-prod-job.sh, so a release doesn't reset it (#64).
          SCHED_CRON="${SCHED_CRON:-0 6 * * *}"
          EXEC_URI="https://run.googleapis.com/v2/projects/${PROD_PROJECT_ID}/locations/${REGION}/jobs/${JOB}:run"
          bash scripts/ensure_run_job_invoker.sh "$JOB" "$PROD_PROJECT_ID" "$REGION" "$SCHED_SA_EMAIL"
          sched_location=(--project "$PROD_PROJECT_ID" --location "${SCHED_REGION:-$REGION}")
          if gcloud scheduler jobs describe "$SCHED" "${sched_location[@]}" >/dev/null 2>&1; then
            action=update
          else
            action=create
          fi
          gcloud scheduler jobs "$action" http "$SCHED" "${sched_location[@]}" \
            --schedule "$SCHED_CRON" \
            --uri "$EXEC_URI" \
            --http-method POST \
            --oauth-service-account-email "$SCHED_SA_EMAIL"

      - name: Run prod job now and ensure artifacts pushed
        if: steps.apply.outputs.applied == 'true'
        run: |
          echo "Executing dbt-prod-run and waiting for completion..."
          gcloud run jobs execute dbt-prod-run --project "$PROD_PROJECT_ID" --region "$REGION" --wait
          echo "Job execution completed successfully."
