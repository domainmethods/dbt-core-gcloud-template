name: release

on:
  push:
    branches: [main]

# Keep the lock through the immediate Cloud Run execution.
concurrency:
  group: production-release
  queue: max
  cancel-in-progress: false

env:
  REGION: ${{ secrets.GCP_REGION }}
  SCHED_REGION: ${{ secrets.GCP_SCHED_REGION }}
  REPO: ${{ secrets.AR_REPO }}
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
  DBT_PROFILES_DIR: /app/profiles

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PROD_SA_EMAIL }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure docker auth to Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev"

      - name: Build container
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_PROD }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          docker build -t "$IMAGE_URI" .

      - name: Smoke test container
        run: |
          echo "Verifying container structure..."
          docker run --rm --entrypoint sh "$IMAGE_URI" -c "
            set -e
            echo 'Checking directory structure...'
            for d in hooks macros models profiles; do
              [ -d \"/app/\$d\" ] || { echo \"FAIL: /app/\$d missing\"; exit 1; }
            done
            echo 'Checking dbt is importable...'
            python -c 'import dbt.version; print(f\"dbt-core {dbt.version.installed}\")'
            echo 'Checking entrypoint exists...'
            [ -x /app/entrypoint.sh ] || { echo 'FAIL: entrypoint.sh not executable'; exit 1; }
            echo 'Smoke test passed.'
          "

      - name: Push container
        run: docker push "$IMAGE_URI"

      - name: Create/Update Cloud Run Job
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOB=dbt-prod-run
          set -e
          COMMON_ARGS=(
            --image "$IMAGE_URI"
            --service-account "${{ secrets.GCP_PROD_SA_EMAIL }}"
            --task-timeout=3600s
            --set-env-vars "DBT_TARGET=prod,CI=true,DBT_GCP_PROJECT_PROD=${{ secrets.GCP_PROJECT_PROD }},DBT_BQ_DATASET_PROD=${{ secrets.PROD_DATASET }},DBT_BQ_LOCATION=${{ secrets.BQ_LOCATION }},DBT_ARTIFACTS_BUCKET=${{ secrets.DBT_ARTIFACTS_BUCKET }},DBT_DOCS_BUCKET=${{ secrets.DBT_DOCS_BUCKET }},GENERATE_DOCS=true,DBT_PROFILES_DIR=/app/profiles"
            --region "${{ env.REGION }}"
          )
          # To inject Secret Manager secrets at runtime, add to COMMON_ARGS:
          #   --set-secrets "API_KEY=api-key-secret:latest,DB_PASS=db-password:latest"
          # Requires: infra/10-bootstrap.sh grants secretAccessor to the prod SA.
          if gcloud run jobs describe "$JOB" --region "${{ env.REGION }}" >/dev/null 2>&1; then
            action=update
          else
            action=create
            COMMON_ARGS+=(--memory=2Gi --cpu=1 --max-retries=0)
          fi

          # Read the live ref after selecting the action and before changing the job.
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq 'select(.protected == true) | .commit.sha')
          if [[ ! "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not verify the head of protected main."
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$current_sha" ]]; then
            echo "::notice::Skipping superseded release $GITHUB_SHA. Current main is $current_sha."
            exit 0
          fi
          gcloud run jobs "$action" "$JOB" "${COMMON_ARGS[@]}"
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Schedule the job (Cloud Scheduler)
        if: steps.apply.outputs.applied == 'true'
        env:
          # Via env, not inlined into the script, so the value is never parsed as shell.
          SCHED_CRON: ${{ secrets.SCHED_CRON }}
        run: |
          SCHED=dbt-prod-nightly
          # Same cron as infra/40-schedule-prod-job.sh, so a release doesn't reset it (#64).
          SCHED_CRON="${SCHED_CRON:-0 6 * * *}"
          EXEC_URI="https://run.googleapis.com/v2/projects/${{ secrets.GCP_PROJECT_PROD }}/locations/${{ env.REGION }}/jobs/dbt-prod-run:run"
          if ! gcloud scheduler jobs describe "$SCHED" --location "${{ env.SCHED_REGION }}" >/dev/null 2>&1; then
            gcloud scheduler jobs create http "$SCHED" \
              --location "${{ env.SCHED_REGION }}" \
              --schedule "$SCHED_CRON" \
              --uri "$EXEC_URI" \
              --http-method POST \
              --oauth-service-account-email "${{ secrets.GCP_SCHEDULER_INVOKER_SA }}"
          else
            gcloud scheduler jobs update http "$SCHED" \
              --location "${{ env.SCHED_REGION }}" \
              --schedule "$SCHED_CRON" \
              --uri "$EXEC_URI" \
              --http-method POST \
              --oauth-service-account-email "${{ secrets.GCP_SCHEDULER_INVOKER_SA }}"
          fi

      - name: Run prod job now and ensure artifacts pushed
        if: steps.apply.outputs.applied == 'true'
        run: |
          echo "Executing dbt-prod-run and waiting for completion..."
          gcloud run jobs execute dbt-prod-run --region "${{ env.REGION }}" --wait
          echo "Job execution completed successfully."
